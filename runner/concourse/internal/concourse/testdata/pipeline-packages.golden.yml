      source:
        location: Europe/Berlin
        start: "3:00"
        stop: "4:00"
      type: time
    - check_every: 1m
      name: trigger-pr
      source:
        access_token: ((github_token))
        base_branch: main
        disable_forks: true
        ignore_drafts: true
        repository: owner/fixture
      type: github-pr
    - check_every: never
      name: planned-pr
      source:
        access_token: ((github_token))
        base_branch: main
        ignore_paths:
            - pipelinegen hand-off of fixture pr
        repository: owner/fixture
      type: github-pr
    - name: sweep-pr-timer
      source:
        interval: 5m
      type: time
