        repository: cfcommunity/github-pr-resource
        tag: 0.26.0
      type: registry-image
resources:
    - check_every: 24h
      name: planner
      source:
        repository: golang
        tag: 1.27.1
      type: registry-image
      version:
        digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
