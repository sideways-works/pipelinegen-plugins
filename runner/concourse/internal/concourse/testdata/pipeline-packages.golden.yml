groups:
    - jobs:
        - plan-main
        - main-backend
        - main-e2e
      name: main
    - jobs:
        - plan-nightly
        - nightly-backend
        - nightly-e2e
      name: nightly
    - jobs:
        - plan-pr
        - sweep-pr
        - pr-backend
        - pr-e2e
      name: pr
    - jobs:
        - pipeline
      name: pipeline
jobs:
    - name: pipeline
      plan:
        - in_parallel:
            - get: repo
              resource: config
              tags:
                - planner
              trigger: true
            - get: planner
              tags:
                - planner
          timeout: 20m
        - config:
            caches:
                - path: cache
                - path: pkgcache
            inputs:
                - name: repo
            outputs:
                - name: tools
                - name: newest
            params:
                GITHUB_TOKEN: ((github_token))
                PIPELINEGEN_BAZELISK: tools/bazelisk
                PIPELINEGEN_BAZELISK_SHA256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                PIPELINEGEN_BAZELISK_VERSION: v1.27.0
                PIPELINEGEN_CONCOURSE_URL: https://ci.example
                PIPELINEGEN_LIMIT: limits.steps=20
                PIPELINEGEN_PACKAGE_CACHE: pkgcache
                PIPELINEGEN_PIPELINE: fixture
                PIPELINEGEN_PIPELINE_SHA256: 83f00303a14b7a8e31a5776bdbadd2c1adeeddfbfd09bdbbc1f923be06fcfeb4
                PIPELINEGEN_PIPELINE_STEP: "1"
                PIPELINEGEN_PLUGINS: ""
                PIPELINEGEN_PRIVATE: ""
                PIPELINEGEN_RUNNER: concourse-runner
                PIPELINEGEN_RUNNER_COMMIT: ""
                PIPELINEGEN_RUNNER_PROGRAM: concourse-runner
                PIPELINEGEN_RUNNER_REPOSITORY: ""
                PIPELINEGEN_RUNNER_SHA256: ""
                PIPELINEGEN_RUNNER_VERSION: ""
                PIPELINEGEN_TOOL_COMMIT: 0123456789abcdef0123456789abcdef01234567
                PIPELINEGEN_TOOL_REPOSITORY: sideways-works/pipelinegen
                PIPELINEGEN_TOOL_SHA256: ""
                PIPELINEGEN_TOOL_VERSION: ""
                PIPELINEGEN_TRUSTED: '{"git_remote":"x"}'
            platform: linux
            run:
                args:
                    - -ec
                    - |
                      # pipelinegen: install what the steps need: curl
                      (
                      set -eu
                      if command -v apt-get >/dev/null 2>&1; then pg_m=apt-get pg_want='curl' pg_none=''
                      elif command -v apk >/dev/null 2>&1; then pg_m=apk pg_want='curl' pg_none=''
                      elif command -v dnf >/dev/null 2>&1; then pg_m=dnf pg_want='curl' pg_none=''
                      elif command -v microdnf >/dev/null 2>&1; then pg_m=microdnf pg_want='curl' pg_none=''
                      elif command -v yum >/dev/null 2>&1; then pg_m=yum pg_want='curl' pg_none=''
                      else
                        echo "pipelinegen: this image has none of the package managers apt-get, apk, dnf, microdnf, yum to install curl" >&2
                        exit 1
                      fi
                      if [ -n "$pg_none" ]; then
                        echo "pipelinegen: these packages name nothing for $pg_m: $pg_none" >&2
                        exit 1
                      fi
                      pg_has() {
                        case $pg_m in
                        apt-get) case "$(dpkg-query -W -f '${Status}' "$1" 2>/dev/null)" in *" ok installed") ;; *) return 1 ;; esac ;;
                        apk) apk info -e "$1" >/dev/null 2>&1 ;;
                        *) rpm -q "$1" >/dev/null 2>&1 ;;
                        esac
                      }
                      pg_missing=
                      for pg_p in $pg_want; do
                        pg_has "$pg_p" || pg_missing="$pg_missing $pg_p"
                      done
                      [ -n "$pg_missing" ] || exit 0
                      if [ "$(id -u)" != 0 ]; then
                        echo "pipelinegen: can't install$pg_missing with $pg_m: the step runs as user $(id -u), not root" >&2
                        exit 1
                      fi
                      pg_cache=${PIPELINEGEN_PACKAGE_CACHE:-}
                      case $pg_cache in ''|/*) ;; *) pg_cache=$PWD/$pg_cache ;; esac
                      echo "pipelinegen: installing$pg_missing with $pg_m" >&2
                      case $pg_m in
                      apt-get)
                        set -- -q -o Dpkg::Use-Pty=0 -o APT::Keep-Downloaded-Packages=true
                        if [ -n "$pg_cache" ]; then
                          mkdir -p "$pg_cache/apt/partial"
                          set -- "$@" -o "Dir::Cache::Archives=$pg_cache/apt"
                        fi
                        DEBIAN_FRONTEND=noninteractive apt-get "$@" update >/dev/null
                        DEBIAN_FRONTEND=noninteractive apt-get "$@" install -y --no-install-recommends $pg_missing >/dev/null
                        if [ -n "${PIPELINEGEN_PACKAGE_CLEAN:-}" ]; then apt-get clean; rm -rf /var/lib/apt/lists/*; fi
                        ;;
                      apk)
                        if [ -n "$pg_cache" ]; then
                          mkdir -p "$pg_cache/apk"
                          apk add --no-progress -q --cache-dir "$pg_cache/apk" --update-cache $pg_missing
                        else
                          apk add --no-progress -q --no-cache $pg_missing
                        fi
                        ;;
                      *)
                        set -- -y
                        [ -z "$pg_cache" ] || set -- "$@" --setopt=keepcache=1 "--setopt=cachedir=$pg_cache/$pg_m"
                        $pg_m "$@" install $pg_missing >/dev/null
                        [ -z "${PIPELINEGEN_PACKAGE_CLEAN:-}" ] || $pg_m clean all >/dev/null
                        ;;
                      esac
                      for pg_p in $pg_missing; do
                        pg_has "$pg_p" || { echo "pipelinegen: $pg_m installed no $pg_p" >&2; exit 1; }
                      done
                      )
                      export PIPELINEGEN_DEADLINE=$(( $(date +%s) + 1200 ))
                      set -eu

                      # The one script a task runs: it places the runner the pipeline pins in
                      # tools/plugins, checked by its sha256 as every pinned file is, and runs the
                      # task's step with it. The runner fetches the other tools itself.
                      runner=tools/plugins/$PIPELINEGEN_RUNNER

                      # The end runs on an abort too, when the build may have broken before it
                      # had anything to end with.
                      if [ "${1:-}" = end ]; then
                        if [ ! -d trigger ]; then
                          echo "no trigger: the build broke before it could report" >&2
                          exit 0
                        fi
                        trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "the tools could not be fetched (exit $rc): the build broke before it could report" >&2; exit 0; fi' EXIT
                      fi

                      # The error hooks post the suite's and the run's statuses as errored when
                      # the runner can't be had either, so a status never stays pending.
                      errored() {
                        echo "the runner could not be fetched (exit $1): posting the statuses as errored" >&2
                        commit=
                        if [ -f trigger/.git/resource/version.json ]; then
                          commit=$(tr -d '\n ' < trigger/.git/resource/version.json | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p')
                        elif [ -d trigger/.git ]; then
                          commit=$(git -C trigger rev-parse HEAD)
                        fi
                        if [ -z "$commit" ]; then
                          echo "no trigger: nothing to post to" >&2
                          exit 0
                        fi
                        # curl reads its authorization header from awk, which reads the token
                        # from the environment
                        for context in "$SUITE_CONTEXT" "$RUN_CONTEXT"; do
                          awk 'BEGIN { t = ENVIRON["PIPELINEGEN_REPORT_TOKEN"]; if (t == "") t = ENVIRON["GITHUB_TOKEN"]; print "Authorization: Bearer " t }' |
                            curl -fsS -X POST -H @- -H "Accept: application/vnd.github+json" \
                              "${PIPELINEGEN_GITHUB_API:-https://api.github.com}/repos/$REPOSITORY/statuses/$commit" \
                              -d "{\"state\":\"error\",\"context\":\"$context\",\"description\":\"the build broke before it could report\",\"target_url\":\"$TARGET_URL\"}" >/dev/null
                        done
                        exit 0
                      }
                      if [ "${1:-}" = report-error ]; then
                        trap 'rc=$?; if [ "$rc" -ne 0 ]; then errored "$rc"; fi' EXIT
                      fi

                      (
                        # the planner's params and secrets are the prepare command's alone
                        for name in ${PIPELINEGEN_PLANNER_ENV:-}; do
                          [ "$name" = GITHUB_TOKEN ] || unset "$name"
                        done
                        p=$PIPELINEGEN_RUNNER_PROGRAM v=$PIPELINEGEN_RUNNER_VERSION c=$PIPELINEGEN_RUNNER_COMMIT
                        repo=$PIPELINEGEN_RUNNER_REPOSITORY
                        if [ -z "$v$c" ]; then
                          echo "the pipeline pins no runner: its config's plugins have none of kind runner" >&2
                          exit 1
                        fi
                        ok() { [ -x "$1" ] && echo "$PIPELINEGEN_RUNNER_SHA256  $1" | sha256sum -c - >/dev/null 2>&1; }

                        # A commit's build has no checksum: one this build placed is the one it built.
                        if [ -x "$runner" ] && { [ -n "$c" ] || ok "$runner"; }; then
                          exit 0
                        fi
                        mkdir -p cache tools/plugins

                        if [ -n "$c" ]; then
                          dir=cache/$p-commit-$c
                          if [ ! -x "$dir/$p" ]; then
                            rm -rf src
                            git init -q src
                            # git's credential helper reads the token from the environment
                            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=credential.https://github.com.helper GIT_TERMINAL_PROMPT=0 \
                              GIT_CONFIG_VALUE_0='!f() { test "$1" = get && echo username=x-access-token && echo "password=${PIPELINEGEN_READ_TOKEN:-${GITHUB_TOKEN:-}}"; }; f' \
                              git -C src fetch -q --depth 1 "https://github.com/$repo.git" "$c"
                            git -C src checkout -q FETCH_HEAD
                            mkdir -p "$dir"
                            (cd src && CGO_ENABLED=0 GOFLAGS=-trimpath GOMODCACHE="$PWD/../cache/gomodcache" GOCACHE="$PWD/../cache/gocache" go build -o "../$dir/$p" "./cmd/$p")
                          fi
                          cp "$dir/$p" "$runner"
                          exit 0
                        fi

                        dir=cache/$p-release-$v
                        if ! ok "$dir/$p"; then
                          mkdir -p "$dir"
                          # curl reads its authorization header from awk, which reads the token
                          # from the environment: no argument or variable here holds it
                          auth() { awk 'BEGIN { t = ENVIRON["PIPELINEGEN_READ_TOKEN"]; if (t == "") t = ENVIRON["GITHUB_TOKEN"]; print "Authorization: Bearer " t }'; }
                          url=$(auth | curl -fsSL -H @- "${PIPELINEGEN_GITHUB_API:-https://api.github.com}/repos/$repo/releases/tags/$v" | tr -d '\n' |
                            grep -o "\"url\": *\"[^\"]*/releases/assets/[0-9]*\"[^{}]*\"name\": *\"$p-linux-amd64\"" | head -n 1 | sed 's/^"url": *"\([^"]*\)".*/\1/')
                          if [ -z "$url" ]; then
                            echo "release $v of $repo has no $p-linux-amd64" >&2
                            exit 1
                          fi
                          auth | curl -fsSL -H @- -H "Accept: application/octet-stream" -o "$dir/$p.tmp" "$url"
                          chmod +x "$dir/$p.tmp"
                          if ! ok "$dir/$p.tmp"; then
                            rm -f "$dir/$p.tmp"
                            echo "release $v of $repo: $p-linux-amd64 doesn't match its sha256" >&2
                            exit 1
                          fi
                          mv "$dir/$p.tmp" "$dir/$p"
                        fi
                        cp "$dir/$p" "$runner"
                        if ! ok "$runner"; then
                          echo "$runner doesn't match its sha256" >&2
                          exit 1
                        fi
                      )

                      trap - EXIT
                      exec "$runner" step "$@"
                    - bootstrap
                    - stale
                path: sh
          image: planner
          tags:
            - planner
          task: stale
          timeout: 20m
