                      # Concourse copies a task's whole cache when the task ends, so each one kept
                      # would cost every build, and a pin that names it again fetches it again
                      dropped=
                      for entry in cache/*-release-* cache/*-commit-* cache/bazelisk-*; do
                        [ -e "$entry" ] || continue
                        if ! grep -qxF "${entry#cache/}" cache/.pinned; then
                          rm -rf "$entry"
                          dropped="$dropped ${entry#cache/}"
                        fi
                      done
                      rm -f cache/.pinned
                      [ -z "$dropped" ] || echo "dropped from the job's cache, as no pin names them:$dropped"
                        )
                        rc=$?
                        set -e
                        if [ "$rc" -ne 0 ] || ! test -x tools/pipelinegen; then
                          echo "the tools could not be fetched (exit $rc): the build broke before it could report" >&2
                          exit 0
                        fi
                      fi
                      rc=0
                      tools/pipelinegen report suite --root trigger --batches batches || rc=$?
                      case "$rc" in
                      0) ;;
                      4) exit 4 ;;
                      *) echo "the suite's end exited $rc; its statuses say why" >&2 ;;
                      esac
                path: sh
        image: planner
        tags:
            - browsers
        task: end
        timeout: 20m
      name: main-e2e
      on_abort:
        config:
