                          sed "s/\"committed\":\"[^\"]*\"/\"committed\":\"$now\"/" "$from/version.json" > "$to/version.json"
                        else
                          sed "s/^{/{\"committed\":\"$now\",/" "$from/version.json" > "$to/version.json"
                        fi
                        if [ -f "$from/metadata.json" ]; then
                          cp "$from/metadata.json" "$to/metadata.json"
                        else
