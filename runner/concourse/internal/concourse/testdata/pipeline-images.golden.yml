                      } || echo "pipelinegen: the packages couldn't be installed; reporting without them" >&2
                      # Reports a suite whose build broke or was aborted. When the build had got
                      # as far as its tools and its trigger, the tool reports the suite itself,
                      # its end mark included, so the run's round can end; a suite's end it could
                      # not record (exit 4) fails this step. Otherwise, or when the tool could
                      # not report, it posts the suite's status and its run's as errored; the end
                      # task, which runs after it, fetches missing tools and ends the suite. Without
                      # the trigger's checkout the commit is unknown, and there is nothing to
                      # post to.
                      set -eu

                      if test -x tools/pipelinegen && test -d trigger; then
                        rc=0
                        tools/pipelinegen report suite --root trigger --batches batches || rc=$?
                        case "$rc" in
                        0|1) exit 0 ;;
                        4) exit 4 ;;
                        esac
                        echo "the suite's end exited $rc: posting its status as errored" >&2
                      fi

                      commit=""
                      if [ -f trigger/.git/resource/version.json ]; then
                        commit=$(tr -d '\n ' < trigger/.git/resource/version.json | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p')
                      elif [ -d trigger/.git ]; then
                        commit=$(git -C trigger rev-parse HEAD)
                      fi

                      if [ -z "$commit" ]; then
                        echo "no trigger: nothing to post to" >&2
                        exit 0
                      fi

                      api=${PIPELINEGEN_GITHUB_API:-https://api.github.com}

                      # curl reads its authorization header from standard input, written by awk
                      # from the environment, so no argument or variable here holds the token
                      for context in "$SUITE_CONTEXT" "$RUN_CONTEXT"; do
                        awk 'BEGIN { t = ENVIRON["PIPELINEGEN_REPORT_TOKEN"]; if (t == "") t = ENVIRON["GITHUB_TOKEN"]; print "Authorization: Bearer " t }' |
                          curl -fsS -X POST -H @- -H "Accept: application/vnd.github+json" \
                          "$api/repos/$REPOSITORY/statuses/$commit" \
                          -d "{\"state\":\"error\",\"context\":\"$context\",\"description\":\"the build broke before it could report\",\"target_url\":\"$TARGET_URL\"}" >/dev/null
                      done
                path: sh
        task: report-error
        timeout: 20m
      plan:
        - in_parallel:
            - get: trigger
              params:
                integration_tool: checkout
              resource: planned-pr
              trigger: true
              version: every
            - get: planner
          timeout: 20m
        - config:
            caches:
                - path: cache
                - path: pkgcache
            inputs:
                - name: trigger
            outputs:
                - name: tools
                - name: source
                - name: gate
                - name: batches
            params:
                GITHUB_TOKEN: ((github_token))
                PIPELINEGEN_BAZELISK: tools/bazelisk
                PIPELINEGEN_BAZELISK_SHA256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                PIPELINEGEN_BAZELISK_VERSION: v1.27.0
                PIPELINEGEN_JOB_URL: https://ci.example/teams/fixture/pipelines/fixture/jobs/pr-backend
                PIPELINEGEN_LIMIT: limits.steps=20
                PIPELINEGEN_PACKAGE_CACHE: pkgcache
                PIPELINEGEN_PIPELINE_STEP: "1"
                PIPELINEGEN_PLUGINS: ""
                PIPELINEGEN_PRIVATE: ""
                PIPELINEGEN_RUN: pr
                PIPELINEGEN_SUITE: backend
                PIPELINEGEN_TOOL_COMMIT: 0123456789abcdef0123456789abcdef01234567
                PIPELINEGEN_TOOL_REPOSITORY: sideways-works/pipelinegen
                PIPELINEGEN_TOOL_SHA256: ""
                PIPELINEGEN_TOOL_VERSION: ""
                PIPELINEGEN_TRIGGER: trigger
                PIPELINEGEN_TRUSTED: '{"git_remote":"x"}'
            platform: linux
            run:
                args:
                    - -ec
                    - |
                      # pipelinegen: install what the steps need: curl
                      (
                      set -eu
                      if command -v apt-get >/dev/null 2>&1; then pg_m=apt-get pg_want='curl' pg_none=''
                      elif command -v apk >/dev/null 2>&1; then pg_m=apk pg_want='curl' pg_none=''
                      elif command -v dnf >/dev/null 2>&1; then pg_m=dnf pg_want='curl' pg_none=''
                      elif command -v microdnf >/dev/null 2>&1; then pg_m=microdnf pg_want='curl' pg_none=''
                      elif command -v yum >/dev/null 2>&1; then pg_m=yum pg_want='curl' pg_none=''
                      else
                        echo "pipelinegen: this image has none of the package managers apt-get, apk, dnf, microdnf, yum to install curl" >&2
                        exit 1
                      fi
                      if [ -n "$pg_none" ]; then
                        echo "pipelinegen: these packages name nothing for $pg_m: $pg_none" >&2
                        exit 1
                      fi
                      pg_has() {
                        case $pg_m in
                        apt-get) case "$(dpkg-query -W -f '${Status}' "$1" 2>/dev/null)" in *" ok installed") ;; *) return 1 ;; esac ;;
                        apk) apk info -e "$1" >/dev/null 2>&1 ;;
                        *) rpm -q "$1" >/dev/null 2>&1 ;;
                        esac
                      }
                      pg_missing=
                      for pg_p in $pg_want; do
                        pg_has "$pg_p" || pg_missing="$pg_missing $pg_p"
                      done
                      [ -n "$pg_missing" ] || exit 0
                      if [ "$(id -u)" != 0 ]; then
