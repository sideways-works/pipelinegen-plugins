groups:
    - jobs:
        - plan-main
        - main-go
        - main-go-whole
        - main-lint
        - main-proof
        - main-smoke
        - main-unit
      name: main
    - jobs:
        - plan-newest
        - newest-proof
      name: newest
    - jobs:
        - plan-nightly
        - nightly-go
        - nightly-go-whole
        - nightly-lint
        - nightly-proof
        - nightly-smoke
        - nightly-unit
      name: nightly
    - jobs:
        - pipeline
        - release
      name: pipeline
jobs:
