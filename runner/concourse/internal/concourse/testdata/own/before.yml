                PIPELINEGEN_PIPELINE_STEP: "1"
                PIPELINEGEN_TRUSTED: '{"ssh_key":{"read":"","store":""},"github_repository":"sideways-works/pipelinegen","github_token":"github_token","github_tokens":{"read":"","changes":"","report":"","store":""},"github_status_prefix":"pipelinegen","bazel_diff":{"version":"","sha256":null,"url":""},"bazel_bazelisk":"bazelisk","plugins":[{"name":"concourse","repository":"sideways-works/concourse-runner","release":{"version":"v0.1.9-rc.4","sha256":"f31bec594a504ade596f52d5031293496ee4d049c726891b42f38ed37c9acc35"}},{"name":"go-correlator","repository":"sideways-works/go-correlator","release":{"version":"v0.1.8-rc.9","sha256":"70bcc88c61194abea16be29370e778e1d3978e17acec305f32c7bdd511b001da"}},{"name":"go-sbom","repository":"sideways-works/go-sbom","release":{"version":"v0.1.3-rc.3","sha256":"fd95aa5ad762e5fb145e16aff50c608d7b43969a01509106dc70a7de8f64573f"}}],"concourse_planner_bootstrap":{"repository":"sideways-works/pipelinegen","release":{"version":"v0.1.13-rc.6","sha256":"43c0903adfd82be0d50835d5aeec9bfaf9028d503ce1707fd14ecb2f98b1c076"},"commit":"","bazelisk":{"version":"v1.30.0","sha256":"a248ae2b2b62b5baebb748f6fba7203bff1a27e5d01b55399a8406744cb539e8"}},"locks":{"suites":{}},"concourse_branch":"main","run_suites":{"main":["go","go-whole","lint","proof","smoke","unit"],"newest":["proof"],"nightly":["go","go-whole","lint","proof","smoke","unit"]}}'
