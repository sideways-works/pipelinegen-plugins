                      set -eu

                      prepare_in trigger

                      # the plan itself sees none of the prepare command's params or secrets
                      without_planner_env

                      exec tools/pipelinegen plan --run "$PIPELINEGEN_RUN" --trigger trigger --root trigger --cache plan-cache
                path: sh
          image: planner
          tags:
            - planner
          task: plan
          timeout: 60m
