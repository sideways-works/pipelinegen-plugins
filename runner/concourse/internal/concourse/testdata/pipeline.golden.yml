resource_types:
    - name: github-pr
      source:
        repository: cfcommunity/github-pr-resource
        tag: 0.26.0
      type: registry-image
resources:
    - check_every: 24h
      name: planner
      source:
        repository: golang
        tag: 1.27.1
      type: registry-image
      version:
        digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    - name: trigger-nightly
      source:
        location: Europe/Berlin
        start: "3:00"
        stop: "4:00"
      type: time
    - check_every: 1m
      name: trigger-pr
      source:
        access_token: ((github_token))
        base_branch: main
        disable_forks: true
        ignore_drafts: true
        repository: owner/fixture
      type: github-pr
    - check_every: never
      name: planned-pr
      source:
        access_token: ((github_token))
        base_branch: main
        ignore_paths:
            - pipelinegen hand-off of fixture pr
        repository: owner/fixture
      type: github-pr
    - name: sweep-pr-timer
      source:
        interval: 5m
      type: time
    - name: branch-main
      source:
        branch: main
        password: ((github_token))
        uri: https://github.com/owner/fixture.git
      type: git
    - name: config
      source:
        branch: main
        password: ((github_token))
        paths:
            - pipelinegen.yaml
        uri: https://github.com/owner/fixture.git
      type: git
