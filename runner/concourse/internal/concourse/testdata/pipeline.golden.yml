                        PROJECTS: phone
                      tags:
                        - browsers
                      task: batch
                      timeout: 120m
                  fail_fast: false
                - file: gate/whole-reconcile.json
                  load_var: whole_0
                - across:
                    - values: ((.:whole_0))
                      var: whole_0_on
