                            PIPELINEGEN_JOB_URL: https://ci.example/teams/fixture/pipelines/fixture/jobs/pr-e2e
                            PIPELINEGEN_LIMIT: limits.steps=20
                            PIPELINEGEN_PIPELINE_STEP: "1"
