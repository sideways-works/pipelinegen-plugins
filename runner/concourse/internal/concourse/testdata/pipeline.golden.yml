                                elif grep -q '"1"' handoffs/.gate/gate.json; then
                                  handoff sweep/head "handoffs/$pr"
                                  list="$list,\"$pr\""
                                fi
                              done

                              rm -rf handoffs/.gate

                              for dir in sweep/handoff/*; do
                                [ -d "$dir" ] || continue
                                pr="${dir##*/}"
                                handoff "$dir" "handoffs/$pr"
                                list="$list,\"$pr\""
                              done

                              printf '[%s]\n' "${list#,}" > handoffs/list.json
                              echo "the sweep hands off [${list#,}]"
                        path: sh
                  image: planner
                  tags:
                    - planner
                  task: write
                  timeout: 60m
                - file: handoffs/list.json
                  load_var: handoffs
                - across:
                    - values: ((.:handoffs))
