name: s3-store
kind: store
program: s3-store
description: "Keeps pipelinegen's records in an S3 bucket"
build:
  image: golang:1.27.1@sha256:162be5298a40ed317005c8339c6de4d10d3eef336d66dc8e9259b03ab9d3a6d2
  # stamped as a release is: v<version> when built through a tag, else v0.0.0-dev+<commit>
  run: [go, build, -trimpath, -buildvcs=false, "-ldflags=-s -w -buildid= -X github.com/sideways-works/pipelinegen-plugins/store/s3/internal/store.Version=v{version}", -o, "{out}/s3-store", ./cmd/s3-store]
  env: {CGO_ENABLED: "0", GOOS: "{os}", GOARCH: "{arch}", GOWORK: "off", GOTOOLCHAIN: local}
  # the modules come from the Go module proxy
  network: true
platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64]
files: [LICENSE, NOTICE]
