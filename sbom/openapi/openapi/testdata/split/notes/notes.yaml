# The notes context: its paths and schemas.
paths:
  /notes:
    get:
      operationId: listNotes
      parameters:
        - $ref: "../shared/common.yaml#/components/parameters/Limit"
      responses:
        "200":
          description: Notes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Note" }
        "400":
          $ref: "../shared/common.yaml#/components/responses/BadRequest"
    post:
      operationId: createNote
      requestBody:
        $ref: "../shared/common.yaml#/components/requestBodies/NewNote"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
  /notes/{id}:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    get:
      operationId: getNote
      responses:
        "200":
          description: One note.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "404":
          $ref: "../shared/common.yaml#/components/responses/NotFound"
    delete:
      operationId: deleteNote
      responses:
        "204": { description: Gone. }
components:
  parameters:
    NoteId:
      name: id
      in: path
      required: true
      schema: { type: string }
  schemas:
    Note:
      type: object
      required: [id, text]
      properties:
        id: { type: string }
        text: { type: string, maxLength: 500 }
