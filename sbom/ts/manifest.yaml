name: ts-sbom
kind: sbom
program: ts-sbom
runtime: "node >=26"
description: "Lists the modules and exports of a TypeScript or JavaScript project"
build:
  # npm ci writes node_modules: the build runs in a copy of the repository; the version is
  # the release's, or 0.0.0-dev+<commit> when built through no tag
  image: node:26.10.0@sha256:9965105b7a4e201d7f07268402bb4971670592b46c9b9058cc643961199a1ab6
  copy: true
  run:
    - [npm, ci, --ignore-scripts, --no-audit, --no-fund]
    - [npm, pkg, set, "version={version}"]
    - [npm, run, --silent, build]
    - [cp, dist/ts-sbom.mjs, "{out}/"]
  network: true
platforms: [any]
files: [LICENSE, NOTICE]
