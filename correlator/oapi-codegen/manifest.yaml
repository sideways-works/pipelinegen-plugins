name: oapi-codegen-correlator
kind: correlator
program: oapi-codegen-correlator
description: "Links Go handlers that oapi-codegen generates to the OpenAPI operations they serve"
build:
  image: golang:1.27.1@sha256:162be5298a40ed317005c8339c6de4d10d3eef336d66dc8e9259b03ab9d3a6d2
  # stamped as a release is: v<version> when built through a tag, else dev+<commit>
  run: [sh, -c, 'v=v{version}; [ "$v" != v ] || v=dev+$(printf %.12s {commit}); exec go build -trimpath -buildvcs=false -ldflags="-s -w -buildid= -X main.Version=$v" -o {out}/oapi-codegen-correlator ./cmd/oapi-codegen-correlator']
  env: {CGO_ENABLED: "0", GOOS: "{os}", GOARCH: "{arch}", GOWORK: "off", GOTOOLCHAIN: local}
  # the modules come from the Go module proxy
  network: true
platforms: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64]
files: [LICENSE, NOTICE]
